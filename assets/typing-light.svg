<svg width="900" height="64" viewBox="0 0 900 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 20px; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
    </style>
    <clipPath id="c1"><rect x="48" y="10" height="44" width="0">
      <animate attributeName="width" values="0;480;480;0;0" keyTimes="0;0.16;0.315;0.3333;1" dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="48" y="10" height="44" width="0">
      <animate attributeName="width" values="0;0;312;312;0;0" keyTimes="0;0.3333;0.4933;0.6483;0.6667;1" dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="48" y="10" height="44" width="0">
      <animate attributeName="width" values="0;0;372;372;0" keyTimes="0;0.6667;0.8267;0.9817;1" dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <text x="18" y="40" class="mono" fill="#0891b2">❯</text>

  <g>
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;0.3333;1" dur="15s" repeatCount="indefinite"/>
    <text x="48" y="40" class="mono" fill="#1e293b" clip-path="url(#c1)">hi, i'm felicia — welcome to my profile</text>
    <rect y="20" width="3" height="26" fill="#0891b2" class="blink">
      <animate attributeName="x" values="50;530;530;50;50" keyTimes="0;0.16;0.315;0.3333;1" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.3333;0.6667" dur="15s" repeatCount="indefinite"/>
    <text x="48" y="40" class="mono" fill="#1e293b" clip-path="url(#c2)">i build things for the web</text>
    <rect y="20" width="3" height="26" fill="#7c3aed" class="blink">
      <animate attributeName="x" values="50;50;362;362;50;50" keyTimes="0;0.3333;0.4933;0.6483;0.6667;1" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1" keyTimes="0;0.3333;0.6667" dur="15s" repeatCount="indefinite"/>
    <text x="48" y="40" class="mono" fill="#1e293b" clip-path="url(#c3)">data, ML &amp; research on the side</text>
    <rect y="20" width="3" height="26" fill="#db2777" class="blink">
      <animate attributeName="x" values="50;50;422;422;50" keyTimes="0;0.6667;0.8267;0.9817;1" dur="15s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
